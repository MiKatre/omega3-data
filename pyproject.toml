[project]
name = "omega3-data"
version = "0.1.0"
description = "Omega-3 supplement prices (Spain, France) normalised to euros per gram of EPA+DHA, with IFOS lab data."
requires-python = ">=3.12"
dependencies = [
  "curl-cffi>=0.11,<0.15",
  "pypdf>=5,<7",
  "selectolax>=0.3.27,<0.5",
]

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.11,<1"]
browser = ["playwright>=1.50,<2"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]
